
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | JemMovieMax</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090909;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 400px;
            padding: 35px;
            background: #181818;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #333;
        }

        h1 {
            color: #e50914;
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: #252525;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b80710;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>JEM MOVIEMAX</h1>

    <h2>Reset Password</h2>

    <p>Enter your new administrator password below.</p>

    <input
        type="password"
        id="password"
        placeholder="New password"
        minlength="8"
        autocomplete="new-password"
    >

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="8"
        autocomplete="new-password"
    >

    <button id="resetButton" onclick="resetPassword()">
        UPDATE PASSWORD
    </button>

    <div id="message" role="status"></div>

</div>

<script>
    const SUPABASE_URL = "https://decinpfjsmrdpbxnzobi.supabase.co";

    // Replace this with your Supabase publishable key.
    const SUPABASE_ANON_KEY = "sb_publishable_SWI1zWYdUnPhbyKzvqsgIQ_o-CSsPrh";

    const client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth: {
                detectSessionInUrl: true,
                persistSession: true,
                autoRefreshToken: true
            }
        }
    );

    const message = document.getElementById("message");
    const button = document.getElementById("resetButton");

    let recoveryReady = false;

    client.auth.onAuthStateChange((event, session) => {
        if (
            event === "PASSWORD_RECOVERY" ||
            (event === "INITIAL_SESSION" && session)
        ) {
            recoveryReady = true;
            message.style.color = "#22c55e";
            message.textContent = "Recovery session detected. Enter your new password.";
        }
    });

    async function resetPassword() {

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (!recoveryReady) {
            message.style.color = "#ff5555";
            message.textContent =
                "Invalid or expired recovery link. Request a new one.";
            return;
        }

        if (password.length < 8) {
            message.style.color = "#ff5555";
            message.textContent =
                "Password must contain at least 8 characters.";
            return;
        }

        if (password !== confirmPassword) {
            message.style.color = "#ff5555";
            message.textContent =
                "Passwords do not match.";
            return;
        }

        button.disabled = true;
        button.textContent = "UPDATING...";

        const { error } = await client.auth.updateUser({
            password: password
        });

        if (error) {
            message.style.color = "#ff5555";
            message.textContent = error.message;
            button.disabled = false;
            button.textContent = "UPDATE PASSWORD";
            return;
        }

        message.style.color = "#22c55e";
        message.textContent =
            "Password updated successfully! Redirecting to admin login...";

        document.getElementById("password").value = "";
        document.getElementById("confirmPassword").value = "";

        setTimeout(() => {
            window.location.href = "admin.html";
        }, 2500);
    }
</script>

</body>
</html>
